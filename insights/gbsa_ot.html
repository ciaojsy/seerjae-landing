<script>
const markdownArticle=document.querySelector('#markdown-article');

const renderMarkdown=(markdown)=>{
  const footnotes=new Map();
  markdown=markdown.replace(/^\[\^([^\]]+)\]:\s*(.+)$/gm,(_,id,text)=>{
    footnotes.set(id,text);
    return '';
  });
  const parsed=document.createElement('div');
  // Marked의 GFM 모드는 `3~6개월` 같은 단일 물결표 범위도 취소선으로
  // 해석한다. 명시적인 `~~취소선~~`은 유지하고 단일 `~`만 문자로 처리한다.
  const safeMarkdown=markdown.replace(/(^|[^~])~(?!~)/g,'$1\\~');
  parsed.innerHTML=marked.parse(safeMarkdown);

  const textWalker=document.createTreeWalker(parsed,NodeFilter.SHOW_TEXT);
  const textNodes=[];
  while(textWalker.nextNode()) textNodes.push(textWalker.currentNode);
  const referenceCounts=new Map();
  textNodes.forEach((textNode)=>{
    if(!/\[\^[^\]]+\]/.test(textNode.data)) return;
    const fragment=document.createDocumentFragment();
    let cursor=0;
    for(const match of textNode.data.matchAll(/\[\^([^\]]+)\]/g)){
      const [token,id]=match;
      if(!footnotes.has(id)) continue;
      fragment.append(textNode.data.slice(cursor,match.index));
      const count=(referenceCounts.get(id)??0)+1;
      referenceCounts.set(id,count);
      const sup=document.createElement('sup');
      sup.className='footnote-ref';
      sup.id=`fnref-${id}-${count}`;
      const link=document.createElement('a');
      link.href=`#fn-${id}`;
      link.setAttribute('aria-label',`각주 ${id}`);
      link.textContent=`[${id}]`;
      sup.append(link);
      fragment.append(sup);
      cursor=match.index+token.length;
    }
    if(cursor===0) return;
    fragment.append(textNode.data.slice(cursor));
    textNode.replaceWith(fragment);
  });
  const title=parsed.querySelector('h1');
  const output=document.createDocumentFragment();

  const hero=document.createElement('header');
  hero.className='hero';
  const heroInner=document.createElement('div');
  heroInner.className='wrap col hero-in';
  const label=document.createElement('span');
  label.className='lab';
  label.textContent="FOUNDER'S NOTE · STARTUP";
  const heading=document.createElement('h1');
  heading.textContent=title?.textContent ?? '경기스타트업 아카데미 OT';
  heroInner.append(label,heading);
  hero.append(heroInner);
  output.append(hero);
  title?.remove();

  const body=document.createElement('div');
  body.className='markdown-body';
  let sectionInner=null;
  [...parsed.children].forEach((node)=>{
    if(node.tagName==='HR') return;
    if(node.tagName==='H2'||sectionInner===null){
      const section=document.createElement('section');
      section.className='part';
      sectionInner=document.createElement('div');
      sectionInner.className='wrap col';
      section.append(sectionInner);
      body.append(section);
    }
    sectionInner.append(node);
  });

  const lastSection=body.querySelector('.part:last-child');
  const sourceParagraph=lastSection?.querySelector(':scope > .col > p:last-child');
  if(sourceParagraph?.querySelector('em')){
    const source=document.createElement('footer');
    source.className='source';
    const sourceInner=document.createElement('div');
    sourceInner.className='wrap col';
    sourceInner.append(sourceParagraph);
    source.append(sourceInner);
    if(!lastSection.querySelector(':scope > .col')?.children.length) lastSection.remove();
    body.append(source);
  }

  if(footnotes.size){
    const footnoteSection=document.createElement('section');
    footnoteSection.className='footnotes';
    footnoteSection.setAttribute('aria-label','각주');
    const footnoteInner=document.createElement('div');
    footnoteInner.className='wrap col';
    const list=document.createElement('ol');
    footnotes.forEach((text,id)=>{
      const item=document.createElement('li');
      item.id=`fn-${id}`;
      item.innerHTML=marked.parseInline(text.replace(/(^|[^~])~(?!~)/g,'$1\\~'));
      const back=document.createElement('a');
      back.className='footnote-back';
      back.href=`#fnref-${id}-1`;
      back.setAttribute('aria-label',`각주 ${id} 본문으로 돌아가기`);
      back.textContent='↩';
      item.append(back);
      list.append(item);
    });
    footnoteInner.append(list);
    footnoteSection.append(footnoteInner);
    body.insertBefore(footnoteSection,body.querySelector('.source'));
  }

  output.append(body);
  markdownArticle.replaceChildren(output);
};

fetch('./창업기초_OT_투자유치_정리.md')
  .then((response)=>{
    if(!response.ok) throw new Error(`HTTP ${response.status}`);
    return response.text();
  })
  .then(renderMarkdown)
  .catch((error)=>{
    console.error('Markdown 로드 실패:',error);
    markdownArticle.innerHTML='<p class="markdown-status error">노트를 불러오지 못했습니다. 웹 서버를 통해 페이지를 열어 주세요.</p>';
  });

const english=new URLSearchParams(location.search).get('lang')==='en';
if(english){
  const setText=(selector,value)=>{const el=document.querySelector(selector);if(el)el.textContent=value};
  const setHtml=(selector,value)=>{const el=document.querySelector(selector);if(el)el.innerHTML=value};
  document.documentElement.lang='en';
  setText('.navlinks a[href="../index.html#company"]','ABOUT');setText('.navlinks a[href="../index.html#product"]','PRODUCT');setText('.navlinks .on','INSIGHTS');setText('.nav-demo','REQUEST A DEMO');
  setText('.nn-lab','Notes');setHtml('.gbsa-note','<b>2026.09.03</b>GBSA Startup & Fundraising OT');setHtml('.term-note','<b>2026.08.23</b>AI Summit Terminology Guide');setHtml('.summit-note','<b>2026.08.21</b>August 2026 AI Summit Review');setHtml('.nn-all','All notes &#8594;');
  const toggle=document.querySelector('.lang-toggle');toggle.textContent='KO';toggle.href=location.pathname;toggle.setAttribute('aria-label','Switch to Korean');document.querySelector('.nn-all').href='index.html?lang=en';document.querySelectorAll('.note-nav ol a').forEach(link=>link.href=`${link.getAttribute('href')}?lang=en`);document.querySelectorAll('a[href^="../index.html"]').forEach(link=>link.href=link.getAttribute('href').replace('../index.html','../index.html?lang=en'));
}
const siteHeader=document.querySelector('.site-head');const syncHeader=()=>siteHeader.classList.toggle('scrolled',scrollY>40);syncHeader();addEventListener('scroll',syncHeader,{passive:true});
</script>
